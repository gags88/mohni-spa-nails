name: Deploy Modern Preview to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mohni-modern-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run automated tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          MAIL_MAILER: array
        run: php artisan test

      - name: Verify production dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php -r "require 'vendor/autoload.php'; exit(function_exists('app_name') ? 0 : 1);"

      - name: Configure and validate SSH key
        shell: bash
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          SSH_DIR="$RUNNER_TEMP/hostinger"
          install -m 700 -d "$SSH_DIR"
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$SSH_DIR/key"
          chmod 600 "$SSH_DIR/key"

          if ! grep -Eq '^-----BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY-----$' "$SSH_DIR/key"; then
            echo '::error::HOSTINGER_SSH_KEY is missing or is not a complete private key.'
            exit 1
          fi

          if ! ssh-keygen -y -f "$SSH_DIR/key" > /dev/null; then
            echo '::error::HOSTINGER_SSH_KEY cannot be parsed. Store an unencrypted private key with its original line breaks.'
            exit 1
          fi

          ssh-keyscan -p 65002 147.93.23.145 > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

          echo "HOSTINGER_KEY=$SSH_DIR/key" >> "$GITHUB_ENV"
          echo "HOSTINGER_KNOWN_HOSTS=$SSH_DIR/known_hosts" >> "$GITHUB_ENV"

      - name: Verify SSH authentication
        run: |
          ssh \
            -i "$HOSTINGER_KEY" \
            -p 65002 \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$HOSTINGER_KNOWN_HOSTS" \
            u464987102@147.93.23.145 \
            'echo "SSH authentication successful"'

      - name: Sync modern preview application to Hostinger
        run: |
          rsync -avz --delete \
            --partial \
            --partial-dir='.rsync-partial' \
            -e "ssh -i $HOSTINGER_KEY -p 65002 -o BatchMode=yes -o UserKnownHostsFile=$HOSTINGER_KNOWN_HOSTS" \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='database/*.sqlite' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='storage/app/' \
            --exclude='storage/framework/' \
            --exclude='storage/logs/' \
            --exclude='public/image/' \
            --exclude='public/storage' \
            --exclude='public/images/banner1.png' \
            --exclude='public/images/banner2.png' \
            --exclude='resources/css/' \
            --exclude='resources/fonts/' \
            --exclude='resources/images/' \
            --exclude='resources/js/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='webpack.mix.js' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='*.zip' \
            --exclude='website-pdf/' \
            --exclude='website-screenshots/' \
            ./ u464987102@147.93.23.145:/home/u464987102/domains/mohnispanails.com/mohnispanails-modern/

      - name: Run post-deploy commands
        run: |
          ssh \
            -i "$HOSTINGER_KEY" \
            -p 65002 \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$HOSTINGER_KNOWN_HOSTS" \
            u464987102@147.93.23.145 'bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail

          PHP=/opt/alt/php83/usr/bin/php
          SOURCE_APP_ROOT=/home/u464987102/domains/mohnispanails.com/mohnispanails
          APP_ROOT=/home/u464987102/domains/mohnispanails.com/mohnispanails-modern
          WEB_ROOT=/home/u464987102/domains/mohnispanails.com/public_html
          MODERN_PUBLIC="$WEB_ROOT/modern"

          cd "$APP_ROOT"

          if [ ! -f "$APP_ROOT/.env" ]; then
            if [ ! -f "$SOURCE_APP_ROOT/.env" ]; then
              echo 'Source production .env is missing; deployment cannot continue.' >&2
              exit 1
            fi

            cp "$SOURCE_APP_ROOT/.env" "$APP_ROOT/.env"
          fi

          "$PHP" scripts/configure_modern_preview.php "$APP_ROOT/.env"
          chmod 600 "$APP_ROOT/.env"

          mkdir -p \
            "$APP_ROOT/bootstrap/cache" \
            "$APP_ROOT/storage/app/public" \
            "$APP_ROOT/storage/framework/cache/data" \
            "$APP_ROOT/storage/framework/sessions" \
            "$APP_ROOT/storage/framework/views" \
            "$APP_ROOT/storage/logs"

          chmod -R ug+rwX "$APP_ROOT/storage" "$APP_ROOT/bootstrap/cache"

          "$PHP" "$(command -v composer)" install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          "$PHP" artisan optimize:clear
          "$PHP" artisan migrate --force
          "$PHP" artisan config:cache
          "$PHP" artisan view:cache

          STORAGE_LINK="$APP_ROOT/public/storage"
          if [ -L "$STORAGE_LINK" ]; then
            ln -sfn "$APP_ROOT/storage/app/public" "$STORAGE_LINK"
          elif [ -e "$STORAGE_LINK" ]; then
            mv "$STORAGE_LINK" "${STORAGE_LINK}_backup_$(date +%Y%m%d_%H%M%S)"
            ln -s "$APP_ROOT/storage/app/public" "$STORAGE_LINK"
          else
            ln -s "$APP_ROOT/storage/app/public" "$STORAGE_LINK"
          fi

          if [ -L "$MODERN_PUBLIC" ]; then
            ln -sfn "$APP_ROOT/public" "$MODERN_PUBLIC"
          elif [ -e "$MODERN_PUBLIC" ]; then
            BACKUP_PATH="${MODERN_PUBLIC}_backup_$(date +%Y%m%d_%H%M%S)"
            mv "$MODERN_PUBLIC" "$BACKUP_PATH"
            ln -s "$APP_ROOT/public" "$MODERN_PUBLIC"
            echo "Existing modern preview moved to: $BACKUP_PATH"
          else
            ln -s "$APP_ROOT/public" "$MODERN_PUBLIC"
          fi

          echo 'Modern preview deployment complete.'
          REMOTE_SCRIPT

      - name: Verify password-protected modern preview
        run: |
          LOGIN_PAGE="$RUNNER_TEMP/modern-preview-login.html"
          PREVIEW_URL="https://mohnispanails.com/modern/?deployment=$GITHUB_SHA"

          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "$PREVIEW_URL")
          if [ "$STATUS" != '302' ]; then
            echo "::error::Expected unauthenticated /modern/ to return 302, received $STATUS."
            exit 1
          fi

          curl --fail --silent --show-error \
            https://mohnispanails.com/modern/preview \
            --output "$LOGIN_PAGE"

          if ! grep -q 'Mohni Nail and Spa website' "$LOGIN_PAGE"; then
            echo '::error::The modern preview login page did not render correctly.'
            exit 1
          fi
